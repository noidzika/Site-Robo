<!DOCTYPE html> <!-- Declara o tipo de documento HTML5 -->
<html lang = 'pt-br'> <!-- Define o idioma da página como português do Brasil -->
<head> <!-- toda pagina html deve conter o head e o body como estrutura base-->
    <title> Contato - Site Robo </title> <!-- Define o título da página que aparece na aba do navegador -->
    <meta charset = 'UTF-8'> <!-- Define a codificação de caracteres como UTF-8 -->
    <link rel = 'stylesheet' href = '../CSS/styles.css'> <!-- Link para o arquivo de estilos CSS que estamos editando -->
    <link href = "https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel = "stylesheet"> <!-- Link para a fonte Bebas Neue -->
</head>
    <body class = 'body_contato'> <!-- Corpo da página onde o conteúdo é exibido -->
        <main class = 'main_contato'> <!-- Elemento principal da página, usado para agrupar o conteúdo principal -->
            <section class = 'conteudo_contato'> <!-- aqui foi usado 'class' para utilizar o CSS junto a esse elemento para estilizar esta section -->
                <div class = 'formulario_contato'>
                    <h1> Formulario de contato </h1>
                    <label for = 'nome'> Nome: </label>
                    <input type = 'text' id = 'nome' name = 'nome' placeholder = 'Digite seu nome completo' required> <!-- O elemento 'input' é usado para criar um campo de entrada de texto. O atributo 'type' define o tipo de entrada, neste caso, 'text' indica que é um campo de texto. O atributo 'id' é usado para identificar o elemento, e o atributo 'name' é usado para nomear o campo para fins de envio de formulário. O atributo 'placeholder' fornece um texto de dica dentro do campo, e o atributo 'required' torna o preenchimento do campo obrigatório. -->
                    <br><br>
                    <label for = 'email'> Email: </label>
                    <input type = 'email' id = 'email' name = 'email' placeholder = 'Digite seu email' required> <!-- O elemento 'input' é usado para criar um campo de entrada de email. O atributo 'type' define o tipo de entrada, neste caso, 'email' indica que é um campo de email. O atributo 'id' é usado para identificar o elemento, e o atributo 'name' é usado para nomear o campo para fins de envio de formulário. O atributo 'placeholder' fornece um texto de dica dentro do campo, e o atributo 'required' torna o preenchimento do campo obrigatório. -->
                    <br><br>
                    <label for = 'telefone'> Telefone: </label>
                    <input type = 'tel' id = 'telefone' name = 'telefone' placeholder = 'Digite seu telefone' required> <!-- O elemento 'input' é usado para criar um campo de entrada de telefone. O atributo 'type' define o tipo de entrada, neste caso, 'tel' indica que é um campo de telefone. O atributo 'id' é usado para identificar o elemento, e o atributo 'name' é usado para nomear o campo para fins de envio de formulário. O atributo 'placeholder' fornece um texto de dica dentro do campo, e o atributo 'required' torna o preenchimento do campo obrigatório. -->
                    <br><br>
                    <label for = 'mensagem'> Mensagem: </label>
                    <textarea id = 'mensagem' name = 'mensagem' placeholder = 'Digite sua mensagem aqui...' required></textarea> <!-- O elemento 'textarea' é usado para criar um campo de texto multilinha. O atributo 'id' é usado para identificar o elemento, e o atributo 'name' é usado para nomear o campo para fins de envio de formulário. O atributo 'placeholder' fornece um texto de dica dentro do campo, e o atributo 'required' torna o preenchimento do campo obrigatório. -->
                    <br>
                    <button type = 'submit'> Enviar </button>
                </div>
                <div class = 'menu3'>
                    <p> algo escrito nesta linha</p>
                    
                </div>
            </section>
            
        </main>
    </body>
</html>
